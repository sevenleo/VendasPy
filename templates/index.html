<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste da API - VendasPy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/styles.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Teste da API VendasPy</h1>
        
        <!-- Seção de Autenticação -->
        <div class="card mb-4">
            <div class="card-header bg-primary text-white">
                Autenticação (/login)
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <input type="text" id="username" class="form-control" placeholder="Usuário" value="admin">
                </div>
                <div class="mb-3">
                    <input type="password" id="password" class="form-control" placeholder="Senha" value="senha123">
                </div>
                <button class="btn btn-primary" onclick="testLogin()">Testar Login</button>
                <div class="mt-3 response-box" id="login-response"></div>
            </div>
        </div>

        <!-- Seção de Produtos -->
        <div class="card mb-4">
            <div class="card-header bg-success text-white">
                Produtos (/produtos)
            </div>
            <div class="card-body">
                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <button class="btn btn-success w-100" onclick="getProdutos()">Listar Produtos</button>
                    </div>
                    <div class="col-md-4">
                        <button class="btn btn-info w-100" onclick="getProdutoById()">Buscar por ID</button>
                    </div>
                    <div class="col-md-4">
                        <button class="btn btn-warning w-100" onclick="countProdutos()">Contar Produtos</button>
                    </div>
                </div>
                <div class="response-box" id="produtos-response"></div>
            </div>
        </div>

        <!-- Seção de Gerenciamento de Produtos (Admin) -->
        <div class="card mb-4">
            <div class="card-header bg-danger text-white">
                Gerenciar Produtos (Admin)
            </div>
            <div class="card-body">
                <h5>Adicionar Novo Produto</h5>
                <div class="mb-3">
                    <input type="text" id="produto-nome" class="form-control" placeholder="Nome do Produto">
                </div>
                <div class="mb-3">
                    <textarea id="produto-descricao" class="form-control" placeholder="Descrição"></textarea>
                </div>
                <div class="mb-3">
                    <input type="number" step="0.01" id="produto-preco" class="form-control" placeholder="Preço (ex: 19.99)">
                </div>
                <div class="mb-3">
                    <input type="text" id="produto-imagem" class="form-control" placeholder="URL da Imagem (opcional)">
                </div>
                <button class="btn btn-primary mb-3" onclick="createProduto()" id="btn-create-produto" disabled>Adicionar Produto</button>

                <hr>

                <h5>Deletar Produto por ID</h5>
                <div class="input-group mb-3">
                    <input type="number" id="produto-delete-id" class="form-control" placeholder="ID do Produto para Deletar">
                    <button class="btn btn-danger" onclick="deleteProduto()" id="btn-delete-produto" disabled>Deletar Produto</button>
                </div>
                <div class="mt-3 response-box" id="admin-produtos-response"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = 'http://localhost:8000';
        let authToken = '';

        async function testLogin() {
            const responseBox = document.getElementById('login-response');
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`
                });

                const data = await response.json();
                if(response.ok) {
                    authToken = data.access_token;
                    responseBox.innerHTML = `<div class="alert alert-success">Token obtido: ${data.access_token}</div>`;
                } else {
                    responseBox.innerHTML = `<div class="alert alert-danger">Erro: ${data.detail}</div>`;
                }
            } catch (error) {
                responseBox.innerHTML = `<div class="alert alert-danger">Erro na requisição: ${error}</div>`;
            }
        }

        async function getProdutos() {
            const response = await fetch(`${API_BASE}/produtos/`);
            displayResponse('produtos-response', await response.json());
        }

        async function getProdutoById() {
            const id = prompt('Digite o ID do produto:');
            if(id) {
                const response = await fetch(`${API_BASE}/produtos/${id}`);
                displayResponse('produtos-response', await response.json());
            }
        }

        async function countProdutos() {
            const response = await fetch(`${API_BASE}/produtos/count`);
            displayResponse('produtos-response', `Total de produtos: ${await response.json()}`);
        }

        function displayResponse(elementId, data) {
            const responseBox = document.getElementById(elementId);
            if (typeof data === 'string') {
                responseBox.innerHTML = `<div class="alert alert-info">${data}</div>`;
            } else {
                 responseBox.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            }
        }

        function enableAdminButtons() {
            document.getElementById('btn-create-produto').disabled = false;
            document.getElementById('btn-delete-produto').disabled = false;
        }

        async function createProduto() {
            const responseBox = document.getElementById('admin-produtos-response');
            if (!authToken) {
                responseBox.innerHTML = `<div class="alert alert-warning">Faça login primeiro.</div>`;
                return;
            }

            const produto = {
                nome: document.getElementById('produto-nome').value,
                descricao: document.getElementById('produto-descricao').value,
                preco: parseFloat(document.getElementById('produto-preco').value),
                imagem_url: document.getElementById('produto-imagem').value || null
            };

            if (!produto.nome || !produto.descricao || isNaN(produto.preco)) {
                 responseBox.innerHTML = `<div class="alert alert-warning">Nome, Descrição e Preço são obrigatórios.</div>`;
                 return;
            }

            try {
                const response = await fetch(`${API_BASE}/produtos/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify(produto)
                });
                const data = await response.json();
                if (response.ok) {
                    responseBox.innerHTML = `<div class="alert alert-success">Produto criado com sucesso!</div><pre>${JSON.stringify(data, null, 2)}</pre>`;
                    // Limpar formulário
                    document.getElementById('produto-nome').value = '';
                    document.getElementById('produto-descricao').value = '';
                    document.getElementById('produto-preco').value = '';
                    document.getElementById('produto-imagem').value = '';
                    getProdutos(); // Atualiza a lista
                } else {
                    responseBox.innerHTML = `<div class="alert alert-danger">Erro ao criar produto: ${data.detail || response.statusText}</div>`;
                }
            } catch (error) {
                responseBox.innerHTML = `<div class="alert alert-danger">Erro na requisição: ${error}</div>`;
            }
        }

        async function deleteProduto() {
            const responseBox = document.getElementById('admin-produtos-response');
            const produtoId = document.getElementById('produto-delete-id').value;

            if (!authToken) {
                responseBox.innerHTML = `<div class="alert alert-warning">Faça login primeiro.</div>`;
                return;
            }
            if (!produtoId) {
                responseBox.innerHTML = `<div class="alert alert-warning">Digite o ID do produto para deletar.</div>`;
                return;
            }

            if (!confirm(`Tem certeza que deseja deletar o produto com ID ${produtoId}?`)) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/produtos/${produtoId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });

                if (response.status === 204) {
                    responseBox.innerHTML = `<div class="alert alert-success">Produto ID ${produtoId} deletado com sucesso!</div>`;
                    document.getElementById('produto-delete-id').value = '';
                    getProdutos(); // Atualiza a lista
                } else {
                    const data = await response.json();
                    responseBox.innerHTML = `<div class="alert alert-danger">Erro ao deletar produto: ${data.detail || response.statusText}</div>`;
                }
            } catch (error) {
                responseBox.innerHTML = `<div class="alert alert-danger">Erro na requisição: ${error}</div>`;
            }
        }

        // Sobrescrever a função de login para habilitar botões admin
        const originalTestLogin = testLogin;
        testLogin = async function() {
            await originalTestLogin(); // Chama a função original
            if (authToken) {
                enableAdminButtons(); // Habilita botões se o login for bem-sucedido
            }
        }

    </script>
</body>
</html>
