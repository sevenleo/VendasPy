<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste da API - VendasPy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/styles.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Teste da API VendasPy</h1>
        
        <!-- Seção de Autenticação -->
        <div class="card mb-4">
            <div class="card-header bg-primary text-white">
                Autenticação (/login)
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <input type="text" id="username" class="form-control" placeholder="Usuário">
                </div>
                <div class="mb-3">
                    <input type="password" id="password" class="form-control" placeholder="Senha">
                </div>
                <button class="btn btn-primary" onclick="testLogin()">Testar Login</button>
                <div class="mt-3 response-box" id="login-response"></div>
            </div>
        </div>

        <!-- Seção de Produtos -->
        <div class="card mb-4">
            <div class="card-header bg-success text-white">
                Produtos (/produtos)
            </div>
            <div class="card-body">
                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <button class="btn btn-success w-100" onclick="getProdutos()">Listar Produtos</button>
                    </div>
                    <div class="col-md-4">
                        <button class="btn btn-info w-100" onclick="getProdutoById()">Buscar por ID</button>
                    </div>
                    <div class="col-md-4">
                        <button class="btn btn-warning w-100" onclick="countProdutos()">Contar Produtos</button>
                    </div>
                </div>
                <div class="response-box" id="produtos-response"></div>
            </div>
        </div>

        <!-- Seção de Gerenciamento de Produtos (Admin) -->
        <div class="card mb-4">
            <div class="card-header bg-danger text-white">
                Gerenciar Produtos (Admin)
            </div>
            <div class="card-body">
                <h5>Adicionar Novo Produto</h5>
                <div id="add-produto-form-container" class="mb-3">
                    <!-- Formulário será gerado aqui -->
                    <p>Carregando formulário...</p>
                </div>
                <button class="btn btn-primary mb-3" onclick="createProduto()" id="btn-create-produto" disabled>Adicionar Produto</button>

                <hr>

                <h5>Deletar Produto por ID</h5>
                <div class="input-group mb-3">
                    <input type="number" id="produto-delete-id" class="form-control" placeholder="ID do Produto para Deletar">
                    <button class="btn btn-danger" onclick="deleteProduto()" id="btn-delete-produto" disabled>Deletar Produto</button>
                </div>
                <div class="mt-3 response-box" id="admin-produtos-response"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = window.API_BASE || '';
        let authToken = '';

        // Função para gerar o formulário dinamicamente
        async function loadSchemaAndGenerateForm() {
            const formContainer = document.getElementById('add-produto-form-container');
            try {
                const response = await fetch(`${API_BASE}/produtos/schema`);
                if (!response.ok) {
                    throw new Error(`Erro ao buscar schema: ${response.statusText}`);
                }
                const schemaData = await response.json();
                formContainer.innerHTML = ''; // Limpa o container

                schemaData.columns.forEach(col => {
                    // Ignora a coluna 'id' pois é gerada automaticamente
                    if (col.name === 'id') return;

                    const div = document.createElement('div');
                    div.className = 'mb-3';

                    const label = document.createElement('label');
                    label.htmlFor = `produto-${col.name}`;
                    label.className = 'form-label';
                    label.textContent = col.name.charAt(0).toUpperCase() + col.name.slice(1).replace('_', ' '); // Capitaliza e substitui underscore

                    let input;
                    if (col.type.includes('TEXT') || col.name === 'descricao') {
                        input = document.createElement('textarea');
                        input.className = 'form-control';
                    } else {
                        input = document.createElement('input');
                        input.className = 'form-control';
                        if (col.type.includes('INTEGER') || col.type.includes('FLOAT') || col.type.includes('NUMERIC')) {
                            input.type = 'number';
                            if (col.type.includes('FLOAT') || col.type.includes('NUMERIC')) {
                                input.step = '0.01';
                            }
                        } else {
                            input.type = 'text';
                        }
                    }

                    input.id = `produto-${col.name}`;
                    input.name = col.name;
                    input.placeholder = `${label.textContent}${col.nullable ? ' (opcional)' : ''}`;
                    if (!col.nullable && input.tagName !== 'TEXTAREA') {
                        // Adiciona required para campos não nulos (exceto textarea por simplicidade)
                        // A validação principal ainda é no backend
                        // input.required = true;
                    }

                    div.appendChild(label);
                    div.appendChild(input);
                    formContainer.appendChild(div);
                });

            } catch (error) {
                console.error('Erro ao gerar formulário:', error);
                formContainer.innerHTML = `<div class="alert alert-danger">Erro ao carregar o formulário: ${error.message}</div>`;
            }
        }

        // Função auxiliar para definir o estado de carregamento de um botão
        function setLoadingState(button, isLoading) {
            if (isLoading) {
                button.disabled = true;
                // Salva o texto original se ainda não foi salvo
                if (!button.dataset.originalText) {
                    button.dataset.originalText = button.innerHTML;
                }
                button.innerHTML = `<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Carregando...`;
            } else {
                button.disabled = false;
                // Restaura o texto original
                if (button.dataset.originalText) {
                    button.innerHTML = button.dataset.originalText;
                    // Remove o texto original salvo para a próxima vez
                    delete button.dataset.originalText;
                }
            }
        }

        async function testLogin() {
            const responseBox = document.getElementById('login-response');
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const button = document.querySelector('.card-body button[onclick="testLogin()"]'); // Seleciona o botão de login

            setLoadingState(button, true);
            try {
                const response = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`
                });

                const data = await response.json();
                if(response.ok) {
                    authToken = data.access_token;
                    responseBox.innerHTML = `<div class="alert alert-success">Token obtido: ${data.access_token}</div>`;
                } else {
                    responseBox.innerHTML = `<div class="alert alert-danger">Erro: ${data.detail}</div>`;
                }
            } catch (error) {
                responseBox.innerHTML = `<div class="alert alert-danger">Erro na requisição: ${error}</div>`;
            } finally {
                setLoadingState(button, false);
            }
        }

        async function getProdutos() {
            const button = document.querySelector('button[onclick="getProdutos()"]');
            setLoadingState(button, true);
            try {
                const response = await fetch(`${API_BASE}/produtos/`);
                displayResponse('produtos-response', await response.json());
            } catch (error) {
                displayResponse('produtos-response', `<div class="alert alert-danger">Erro ao buscar produtos: ${error}</div>`);
            } finally {
                setLoadingState(button, false);
            }
        }

        async function getProdutoById() {
            const id = prompt('Digite o ID do produto:');
            if(id) {
                const button = document.querySelector('button[onclick="getProdutoById()"]');
                setLoadingState(button, true);
                try {
                    const response = await fetch(`${API_BASE}/produtos/${id}`);
                    displayResponse('produtos-response', await response.json());
                } catch (error) {
                    displayResponse('produtos-response', `<div class="alert alert-danger">Erro ao buscar produto por ID: ${error}</div>`);
                } finally {
                    setLoadingState(button, false);
                }
            }
        }

        async function countProdutos() {
            const button = document.querySelector('button[onclick="countProdutos()"]');
            setLoadingState(button, true);
            try {
                const response = await fetch(`${API_BASE}/produtos/count`);
                displayResponse('produtos-response', `Total de produtos: ${await response.json()}`);
            } catch (error) {
                displayResponse('produtos-response', `<div class="alert alert-danger">Erro ao contar produtos: ${error}</div>`);
            } finally {
                setLoadingState(button, false);
            }
        }

        function displayResponse(elementId, data) {
            const responseBox = document.getElementById(elementId);
            if (typeof data === 'string') {
                responseBox.innerHTML = `<div class="alert alert-info">${data}</div>`;
            } else {
                 responseBox.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            }
        }

        function enableAdminButtons() {
            document.getElementById('btn-create-produto').disabled = false;
            document.getElementById('btn-delete-produto').disabled = false;
        }

        async function createProduto() {
            const responseBox = document.getElementById('admin-produtos-response');
            const button = document.getElementById('btn-create-produto');

            if (!authToken) {
                responseBox.innerHTML = `<div class="alert alert-warning">Faça login primeiro.</div>`;
                return;
            }

            const formContainer = document.getElementById('add-produto-form-container');
            const inputs = formContainer.querySelectorAll('input, textarea');
            const produto = {};
            let valid = true;
            let missingFields = [];

            inputs.forEach(input => {
                const colName = input.name;
                let value = input.value.trim();
                const isNullable = input.placeholder.includes('(opcional)'); // Verifica se o campo é opcional pelo placeholder

                if (!value && !isNullable) {
                    valid = false;
                    missingFields.push(colName.charAt(0).toUpperCase() + colName.slice(1));
                }

                if (input.type === 'number') {
                    if (value === '') {
                        produto[colName] = null; // Envia null se vazio e opcional
                    } else {
                        const numValue = parseFloat(value);
                        if (isNaN(numValue)) {
                            valid = false;
                            missingFields.push(`${colName.charAt(0).toUpperCase() + colName.slice(1)} (valor inválido)`);
                        } else {
                            produto[colName] = numValue;
                        }
                    }
                } else {
                    produto[colName] = value || null; // Envia null se vazio
                }
            });

            if (!valid) {
                 responseBox.innerHTML = `<div class="alert alert-warning">Campos obrigatórios faltando ou inválidos: ${missingFields.join(', ')}.</div>`;
                 return;
            }

            setLoadingState(button, true);
            try {
                const response = await fetch(`${API_BASE}/produtos/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify(produto)
                });
                const data = await response.json();
                if (response.ok) {
                    responseBox.innerHTML = `<div class="alert alert-success">Produto criado com sucesso!</div><pre>${JSON.stringify(data, null, 2)}</pre>`;
                    // Limpar formulário dinâmico
                    inputs.forEach(input => input.value = '');
                    getProdutos(); // Atualiza a lista
                } else {
                    // Tenta extrair a mensagem de erro detalhada do FastAPI
                    let errorMsg = response.statusText;
                    if (data.detail) {
                        if (Array.isArray(data.detail)) {
                            // Formata múltiplos erros de validação
                            errorMsg = data.detail.map(err => `${err.loc.join('.')} - ${err.msg}`).join('<br>');
                        } else if (typeof data.detail === 'string') {
                            errorMsg = data.detail;
                        }
                    }
                    responseBox.innerHTML = `<div class="alert alert-danger">Erro ao criar produto (${response.status}):<br>${errorMsg}</div>`;
                }
            } catch (error) {
                responseBox.innerHTML = `<div class="alert alert-danger">Erro na requisição: ${error}</div>`;
            }
        }

        async function deleteProduto() {
            const responseBox = document.getElementById('admin-produtos-response');
            const produtoId = document.getElementById('produto-delete-id').value;
            const button = document.getElementById('btn-delete-produto');

            if (!authToken) {
                responseBox.innerHTML = `<div class="alert alert-warning">Faça login primeiro.</div>`;
                return;
            }
            if (!produtoId) {
                responseBox.innerHTML = `<div class="alert alert-warning">Digite o ID do produto para deletar.</div>`;
                return;
            }

            if (!confirm(`Tem certeza que deseja deletar o produto com ID ${produtoId}?`)) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/produtos/${produtoId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });

                if (response.status === 204) {
                    responseBox.innerHTML = `<div class="alert alert-success">Produto ID ${produtoId} deletado com sucesso!</div>`;
                    document.getElementById('produto-delete-id').value = '';
                    getProdutos(); // Atualiza a lista
                } else {
                    const data = await response.json();
                    responseBox.innerHTML = `<div class="alert alert-danger">Erro ao deletar produto: ${data.detail || response.statusText}</div>`;
                }
            } catch (error) {
                responseBox.innerHTML = `<div class="alert alert-danger">Erro na requisição: ${error}</div>`;
            }
        }

        // Sobrescrever a função de login para habilitar botões admin
        const originalTestLogin = testLogin;
        testLogin = async function() {
            await originalTestLogin(); // Chama a função original
            if (authToken) {
                enableAdminButtons(); // Habilita botões se o login for bem-sucedido
            }
        }

        // Chama a função para gerar o formulário quando o DOM estiver pronto
        document.addEventListener('DOMContentLoaded', loadSchemaAndGenerateForm);

    </script>
</body>
</html>
