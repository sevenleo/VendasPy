<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste da API - VendasPy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/styles.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Teste da API VendasPy</h1>
        
        <!-- Seção de Autenticação -->
        <div class="card mb-4">
            <div class="card-header bg-primary text-white">
                Autenticação (/login)
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <input type="text" id="username" class="form-control" placeholder="Usuário" value="admin">
                </div>
                <div class="mb-3">
                    <input type="password" id="password" class="form-control" placeholder="Senha" value="senha123">
                </div>
                <button class="btn btn-primary" onclick="testLogin()">Testar Login</button>
                <div class="mt-3 response-box" id="login-response"></div>
            </div>
        </div>

        <!-- Seção de Produtos -->
        <div class="card mb-4">
            <div class="card-header bg-success text-white">
                Produtos (/produtos)
            </div>
            <div class="card-body">
                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <button class="btn btn-success w-100" onclick="getProdutos()">Listar Produtos</button>
                    </div>
                    <div class="col-md-4">
                        <button class="btn btn-info w-100" onclick="getProdutoById()">Buscar por ID</button>
                    </div>
                    <div class="col-md-4">
                        <button class="btn btn-warning w-100" onclick="countProdutos()">Contar Produtos</button>
                    </div>
                </div>
                <div class="response-box" id="produtos-response"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = 'http://localhost:8000';
        let authToken = '';

        async function testLogin() {
            const responseBox = document.getElementById('login-response');
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`
                });

                const data = await response.json();
                if(response.ok) {
                    authToken = data.access_token;
                    responseBox.innerHTML = `<div class="alert alert-success">Token obtido: ${data.access_token}</div>`;
                } else {
                    responseBox.innerHTML = `<div class="alert alert-danger">Erro: ${data.detail}</div>`;
                }
            } catch (error) {
                responseBox.innerHTML = `<div class="alert alert-danger">Erro na requisição: ${error}</div>`;
            }
        }

        async function getProdutos() {
            const response = await fetch(`${API_BASE}/produtos/`);
            displayResponse('produtos-response', await response.json());
        }

        async function getProdutoById() {
            const id = prompt('Digite o ID do produto:');
            if(id) {
                const response = await fetch(`${API_BASE}/produtos/${id}`);
                displayResponse('produtos-response', await response.json());
            }
        }

        async function countProdutos() {
            const response = await fetch(`${API_BASE}/produtos/count`);
            displayResponse('produtos-response', `Total de produtos: ${await response.json()}`);
        }

        function displayResponse(elementId, data) {
            const responseBox = document.getElementById(elementId);
            responseBox.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
        }
    </script>
</body>
</html>
